<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweden Energy Transition</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Sweden Energy Transition</h1>
    <p>Understanding Sweden's energy system</p>
</header>

<section class="energy-mix">
    <h2>Electricity Mix</h2>

    <div class="energy-grid">

        <div class="energy-card">
            <div class="energy-icon">💧</div>
            <h3>Hydro</h3>
            <p class="percentage">40%</p>
            <p>Hydropower</p>
        </div>

        <div class="energy-card">
            <div class="energy-icon">⚛️</div>
            <h3>Nuclear</h3>
            <p class="percentage">30%</p>
            <p>Nuclear power</p>
        </div>

        <div class="energy-card">
            <div class="energy-icon">🌬️</div>
            <h3>Wind</h3>
            <p class="percentage">25%</p>
            <p>Wind power</p>
        </div>

        <div class="energy-card">
            <div class="energy-icon">☀️</div>
            <h3>Solar</h3>
            <p class="percentage">5%</p>
            <p>Solar power</p>
        </div>

    </div>
</section>

</body>
</html>
